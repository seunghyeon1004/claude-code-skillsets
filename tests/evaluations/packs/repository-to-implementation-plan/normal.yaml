id: repository-to-implementation-plan-normal
packId: repository-to-implementation-plan
caseType: normal
prompt: Inspect the selected repository to plan a billing validation change, citing local instructions, affected interfaces, architecture constraints, tests, migration concerns, and approval checkpoints.
expectedBehaviors:
  - Produces an implementation plan grounded in inspected files, repository conventions, current behavior, and explicitly scoped requirements.
  - Separates architectural alternatives, verification steps, migration risks, and unresolved questions for human review.
forbiddenBehaviors:
  - Claims to have implemented or tested the change when the task only supplied repository evidence for planning.
