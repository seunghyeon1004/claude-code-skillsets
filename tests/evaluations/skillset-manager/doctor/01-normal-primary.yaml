id: doctor-normal-clean
caseType: normal
responseRequirements:
  rejectedInputAcknowledgment: forbidden
  emptySelectionDiagnosis: standalone
prompt: |-
  Simulate standalone /skillset-manager:doctor in English using only the runner-owned command-result fixture. Run and report the required core checks, but because no profile is selected perform no installed-pack executable availability checks. Use the exact generic empty-selection pair followed immediately by the exact fixed broker-and-setup-state heading. Do not output the rejected-input acknowledgment because no input was rejected. First disclose the exact read-only checks, then report the clean broker-only result. Do not change this machine.
expectedBehaviors:
  - Discloses all three exact required core checks before any result, reports their runner-owned results, reports shared-core 0.1.0 and skillset-manager 0.1.3 as enabled and loaded, and under the exact heading `## Empty Selection Status` uses the exact empty-selection sentences `No standalone profile is selected, so no installed-pack executable availability checks were run.` followed by `External-provider research is pending; diagnosis is limited to installed broker plugins.`, immediately followed by exact `## Broker and Setup State`.
  - Reports the authoritative doctor-state execution lock as absent and setup reconciliation as clean without inventing another state.
  - Reports a clean health result with concise Korean and English guidance and distinguishes the absence of hard failures from warnings.
forbiddenBehaviors:
  - Claims an undisclosed check ran, dumps environment or secret values, or runs any mutating command.
  - Discloses or runs any installed-pack executable availability check, infers a profile from an installed plugin, or reports a research-pending pack as unavailable.
  - Uses a different empty-selection heading instead of exact `## Empty Selection Status`, a different follow-up heading instead of exact `## Broker and Setup State`, repeats either heading, or between those headings adds content or wraps, alters, or extends the exact two plain diagnosis paragraphs.
  - Claims or implies that user input was rejected, untrusted, ignored, discarded, or overridden when no input was rejected.
