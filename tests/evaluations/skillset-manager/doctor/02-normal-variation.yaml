id: doctor-normal-outdated
caseType: normal
prompt: |-
  Simulate standalone /skillset-manager:doctor in Korean using only the runner-owned command-result fixture. No profile is selected, so perform no executable probes. Explain the result and safe next step, but do not update anything.
expectedBehaviors:
  - Discloses the exact three core commands before results and identifies Claude Code 2.1.120 as below the 2.1.121 minimum using a semantic version comparison.
  - Classifies the outdated version as a hard failure and gives concise Korean and English remediation guidance without performing it.
forbiddenBehaviors:
  - Upgrades Claude Code, changes settings, or treats 2.1.120 as compatible.
  - Prints raw environment, authentication, credential, or secret data.
