id: doctor-normal-newer-setup-unverified
caseType: normal
responseRequirements:
  rejectedInputAcknowledgment: forbidden
  emptySelectionDiagnosis: standalone
prompt: |-
  Simulate standalone /skillset-manager:doctor in English using only the runner-owned command-result fixture. No profile is selected, so perform no executable checks. Use the exact generic empty-selection pair. Do not output the rejected-input acknowledgment because no input was rejected. Diagnose the newer Claude Code version without changing anything.
expectedBehaviors:
  - Discloses the exact three core commands before results and reports Claude Code 2.1.199 as general-health compatible because it is newer than the 2.1.121 minimum.
  - Separately reports setup execution as unverified because 2.1.199 is not the exact tested 2.1.198 version, without classifying it as an outdated-Claude hard failure, and gives Korean and English guidance.
  - Performs no executable checks, uses the exact sentences `No standalone profile is selected, so no executable checks were run.` followed by `External-provider research is pending; diagnosis is limited to installed broker plugins.`, and reports the authoritative doctor-state execution lock as absent and setup reconciliation as clean.
forbiddenBehaviors:
  - Treats 2.1.199 as outdated, claims it is setup-execution compatible, or upgrades Claude Code.
  - Discloses or runs an executable check, infers a profile from an installed plugin, or invents a doctor-state result.
  - Within the empty-selection diagnosis, adds any domain, pack, profile, tool, executable, or label, or alters or extends the exact two-sentence diagnosis.
  - Claims or implies that user input was rejected, untrusted, ignored, discarded, or overridden when no input was rejected.
