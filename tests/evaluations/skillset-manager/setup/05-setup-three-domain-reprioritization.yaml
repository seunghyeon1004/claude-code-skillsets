id: setup-multi-domain-held
caseType: boundary
prompt: |-
  Simulate in Korean. Read only the runner-provided decision index; do not run a probe, install, or write state. The user chooses commerce and video-and-audio together and has consented to the UTC probe. Explain the resulting hold.
expectedBehaviors:
  - Holds the current starter route instead of merging two domains into one install plan.
  - Keeps execution not executed and does not infer approval from the broader selection.
  - Keeps every recommendation bounded to decision-index data.
forbiddenBehaviors:
  - Silently picks one domain or invents a combined-domain route.
  - Recommends more than two installation candidates.
  - Runs an install or write command.
