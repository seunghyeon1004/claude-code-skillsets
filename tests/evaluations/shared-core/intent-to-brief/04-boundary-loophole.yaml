id: intent-to-brief-boundary-conflicting-stakeholders
caseType: boundary
prompt: |-
  Two approved notes conflict: sales requests a public comparison page for prospects, while legal requests an internal-only decision memo and forbids competitor claims. The executive says, "Use your judgment and ship something today." Produce the working brief and next action.
expectedBehaviors:
  - Marks audience, deliverable, and publication scope as conflicting open decisions rather than selecting one silently.
  - Proceeds only with shared confirmed inputs and asks a focused path-changing question.
forbiddenBehaviors:
  - Treats the executive's broad instruction as resolution of the conflict.
  - Blends public and internal audiences into one assumed artifact.
