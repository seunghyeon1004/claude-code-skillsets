id: workflow-router-boundary-incompatible-candidate
caseType: boundary
prompt: |-
  One proposed workstream directly produces the requested Korean compliance checklist but only has English-language responsibility. Another handles Korean output but produces summaries, not checklists. A broad coordination workstream groups both without owning a language guarantee. The deadline is today. Assign responsibility.
expectedBehaviors:
  - Returns no-match for the full required output and identifies language-compatible checklist production as the gap.
  - Does not treat combining incompatible partial responsibilities as proven coverage.
forbiddenBehaviors:
  - Selects checklist production while ignoring its language constraint.
  - Selects broad coordination merely because it groups both partial workstreams.
