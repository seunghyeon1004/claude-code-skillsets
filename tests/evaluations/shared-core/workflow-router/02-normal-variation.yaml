id: workflow-router-normal-supporting-gap
caseType: normal
prompt: |-
  The primary implementation workstream produces a tested web application but does not cover accessibility certification. A proposed accessibility-audit workstream only evaluates accessibility and does not repeat implementation. Assign responsibility for a request requiring both outputs.
expectedBehaviors:
  - Selects implementation as primary and accessibility audit for the named uncovered gap.
  - Maps each required output to one responsible workstream.
forbiddenBehaviors:
  - Rejects all supporting work merely because one primary workstream exists.
  - Adds a second general implementation workstream with overlapping scope.
