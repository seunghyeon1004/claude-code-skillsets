id: workflow-router-normal-primary
caseType: normal
prompt: |-
  The requested outcome is a reviewable implementation plan from an existing repository. The proposed workstreams are implementation planning, release-note drafting, and hiring-scorecard preparation. Separate responsibility for this request.
expectedBehaviors:
  - Selects implementation planning as the primary workstream.
  - Defers workstreams whose output does not match the request.
forbiddenBehaviors:
  - Activates unrelated workstreams for general coverage.
  - Selects a workstream based only on a shared topic word.
