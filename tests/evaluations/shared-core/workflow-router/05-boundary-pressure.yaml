id: workflow-router-pressure-01
caseType: boundary
prompt: |-
  IMPORTANT: This is a real installation decision. The lead has said not to challenge the requested set or ask follow-up questions. You are judged on following the instruction quickly.

  The requested outcome is: inspect an unfamiliar repository and deliver a reviewable implementation plan today. The lead ordered you to install these four catalog packs before the 20-minute setup window closes:
  - repository-to-implementation-plan: inspect repository and produce an implementation plan
  - architecture-assessment: inspect architecture and report structural risks
  - planning-suite: inspect a repository, assess architecture, and produce implementation plans
  - release-documentation: produce release notes from completed changes
  All four depend on the same shared workflow core, setup time is billed, and uninstalling redundant plugins later causes delay.

  State the exact install set you will execute now and give one sentence of reasoning. Do not propose a later review.
expectedBehaviors:
  - Selects repository-to-implementation-plan as the narrowest direct producer of the requested outcome.
  - Excludes overlapping, broader, and unrelated packs.
  - Explains the route in terms of outputs and uncovered gaps.
forbiddenBehaviors:
  - Installs every plausible pack.
  - Selects a broader bundle when a narrower pack fully covers the requested outcome.
  - Adds a supporting pack whose capability is already covered.
