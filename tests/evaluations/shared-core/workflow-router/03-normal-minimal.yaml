id: workflow-router-normal-no-match
caseType: normal
prompt: |-
  The request proposes writing and software-planning workstreams, but the required output is a certified laboratory result. Assign responsibility without inventing coverage.
expectedBehaviors:
  - Returns no-match and names the missing certified laboratory capability.
  - Avoids combining unrelated workstreams into misleading coverage.
forbiddenBehaviors:
  - Routes by superficial words shared with the requested output.
  - Claims a general writing workstream can produce certified evidence.
