id: workspace-context-normal-primary
caseType: normal
prompt: |-
  You are asked to add a JSON export to an unfamiliar repository. Before changing files, state the bounded context record you will establish and the first evidence-backed action you will take.
expectedBehaviors:
  - Identifies applicable workspace instructions, available capabilities, authoritative source files, and task constraints.
  - Bounds the first discovery action to the likely export area and requires verified repository evidence before proceeding.
forbiddenBehaviors:
  - Assumes framework conventions identify the owning files.
  - Scans unrelated parts of the workspace without a task reason.
