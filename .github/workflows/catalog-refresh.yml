name: Catalog refresh

on:
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:
    inputs:
      expected_tip:
        description: Exact 40-character lowercase main tip to refresh
        required: true
        type: string

permissions: {}

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
    steps:
      - name: Require separately enabled catalog maintenance
        env:
          CATALOG_REFRESH_ENABLED: ${{ vars.CATALOG_REFRESH_ENABLED }}
        run: |
          set -euo pipefail
          test "$CATALOG_REFRESH_ENABLED" = enabled
      - name: Validate the event-bound catalog base
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_TIP: ${{ inputs.expected_tip }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          case "$EVENT_NAME" in
            workflow_dispatch)
              [[ "$EXPECTED_TIP" =~ ^[0-9a-f]{40}$ ]]
              test "$GITHUB_SHA" = "$EXPECTED_TIP"
              ;;
            schedule)
              test -z "${EXPECTED_TIP:-}"
              [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
              ;;
            *) printf '%s\n' "Unsupported catalog refresh event: $EVENT_NAME" >&2; exit 1 ;;
          esac
      - name: Check out the event-bound base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_tip || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the checked-out event commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_TIP: ${{ inputs.expected_tip }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse --verify HEAD^{commit})"
          test "$HEAD_SHA" = "$GITHUB_SHA"
          case "$EVENT_NAME" in
            workflow_dispatch) test "$HEAD_SHA" = "$EXPECTED_TIP" ;;
            schedule) test -z "${EXPECTED_TIP:-}" ;;
            *) printf '%s\n' "Unsupported catalog refresh event: $EVENT_NAME" >&2; exit 1 ;;
          esac
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify the approved registry anchor before collection
        env:
          REGISTRY_APPROVAL_ANCHORED: ${{ vars.REGISTRY_APPROVAL_ANCHORED }}
          APPROVED_REGISTRY_TAG_OBJECT: ${{ secrets.APPROVED_REGISTRY_TAG_OBJECT }}
        run: bash scripts/research/require-registry-anchor-input.sh --mode current-tip
      - name: Stage and validate the catalog candidate
        id: refresh
        # The runner creates automation/catalog-refresh-<baseDigest8>-${{ github.run_id }}.
        # It observes every tracked source, commits the candidate, runs all gates, and emits a Git bundle.
        env:
          REGISTRY_APPROVAL_ANCHORED: ${{ vars.REGISTRY_APPROVAL_ANCHORED }}
          APPROVED_REGISTRY_TAG_OBJECT: ${{ secrets.APPROVED_REGISTRY_TAG_OBJECT }}
        run: |
          artifact_dir="${RUNNER_TEMP}/catalog-refresh-artifact"
          mkdir -m 700 "$artifact_dir"
          npm run research:refresh -- \
            --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --github-run-id "${GITHUB_RUN_ID}" \
            --staging-parent "${RUNNER_TEMP}" \
            --artifact-dir "$artifact_dir" \
            --base-sha "${GITHUB_SHA}"
          if test -f "$artifact_dir/candidate.bundle"; then
            printf '%s\n' 'changed=true' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload validated catalog artifact
        if: ${{ steps.refresh.outputs.changed == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4.6.2
        with:
          name: validated-catalog-${{ github.run_id }}
          path: ${{ runner.temp }}/catalog-refresh-artifact
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: validate
    if: ${{ needs.validate.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download validated catalog artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact v8.0.1
        with:
          name: validated-catalog-${{ github.run_id }}
          path: ${{ runner.temp }}/catalog-refresh-artifact
      - name: Verify validated catalog artifact
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/catalog-refresh-artifact"
          test "$(find "$artifact_dir" -type f | wc -l | tr -d ' ')" = 7
          base_sha="$(cat "$artifact_dir/base-sha")"
          candidate_sha="$(cat "$artifact_dir/candidate-sha")"
          branch="$(cat "$artifact_dir/branch")"
          base_digest="$(cat "$artifact_dir/base-digest")"
          result_digest="$(cat "$artifact_dir/result-digest")"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$base_digest" =~ ^[0-9a-f]{64}$ ]]
          [[ "$result_digest" =~ ^[0-9a-f]{64}$ ]]
          test "$branch" = "automation/catalog-refresh-${base_digest:0:8}-${GITHUB_RUN_ID}"
          (cd "$artifact_dir" && sha256sum --check candidate.bundle.sha256)
          verify_repo="${RUNNER_TEMP}/catalog-refresh-verify"
          git init --quiet "$verify_repo"
          git -C "$verify_repo" bundle verify "$artifact_dir/candidate.bundle"
          git -C "$verify_repo" fetch "$artifact_dir/candidate.bundle" HEAD:refs/catalog-refresh/candidate
          test "$(git -C "$verify_repo" rev-parse refs/catalog-refresh/candidate)" = "$candidate_sha"
          git -C "$verify_repo" merge-base --is-ancestor "$base_sha" "$candidate_sha"
      - name: Check out current remote main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Push validated branch and open review PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/catalog-refresh-artifact"
          base_sha="$(cat "$artifact_dir/base-sha")"
          candidate_sha="$(cat "$artifact_dir/candidate-sha")"
          branch="$(cat "$artifact_dir/branch")"
          base_digest="$(cat "$artifact_dir/base-digest")"
          result_digest="$(cat "$artifact_dir/result-digest")"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$base_digest" =~ ^[0-9a-f]{64}$ ]]
          [[ "$result_digest" =~ ^[0-9a-f]{64}$ ]]
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$GITHUB_REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]
          test "$branch" = "automation/catalog-refresh-${base_digest:0:8}-${GITHUB_RUN_ID}"
          test "$(git rev-parse HEAD)" = "$base_sha"
          test "$(find "$artifact_dir" -type f | wc -l | tr -d ' ')" = 7
          (cd "$artifact_dir" && sha256sum --check candidate.bundle.sha256)
          git bundle verify "$artifact_dir/candidate.bundle"
          candidate_ref="refs/catalog-refresh/publish/${GITHUB_RUN_ID}"
          if git show-ref --verify --quiet "$candidate_ref"; then
            printf '%s\n' "catalog refresh temporary ref already exists: $candidate_ref" >&2
            exit 1
          fi
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          body="catalog-refresh-base-digest: ${base_digest}
          catalog-refresh-result-digest: ${result_digest}"
          branch_push_attempted=false
          pr_post_attempted=false
          created_pr_number=""
          branch_inventory_sha=""
          candidate_pr_related_matches="[]"
          candidate_pr_related_count=0
          candidate_pr_matches="[]"
          candidate_pr_count=0
          require_same_repository_identity() {
            local description="$1" json="$2"
            if ! jq -e \
              --arg expected_repository "$GITHUB_REPOSITORY" \
              --arg expected_repository_id "$GITHUB_REPOSITORY_ID" \
              '(
                ((.head.repo.full_name // "") | ascii_downcase) == ($expected_repository | ascii_downcase) and
                ((.base.repo.full_name // "") | ascii_downcase) == ($expected_repository | ascii_downcase) and
                ((.head.repo.id // "") | tostring) == $expected_repository_id and
                ((.base.repo.id // "") | tostring) == $expected_repository_id
              )' <<<"$json" >/dev/null; then
              printf '%s\n' "$description has foreign repository identity; operator review required" >&2
              return 1
            fi
          }
          inventory_candidate_branch() {
            local inventory exact_matches exact_count expected_ref
            expected_ref="refs/heads/$branch"
            if ! inventory="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/${branch}")"; then
              printf '%s\n' "authenticated candidate branch lookup failed; operator inventory required for $expected_ref" >&2
              return 1
            fi
            if ! exact_matches="$(jq -c --arg expected_ref "$expected_ref" \
              '[.[] | select(.ref == $expected_ref)]' <<<"$inventory")"; then
              printf '%s\n' "authenticated candidate branch inventory was invalid; operator inventory required for $expected_ref" >&2
              return 1
            fi
            if ! exact_count="$(jq -r 'length' <<<"$exact_matches")" || [[ ! "$exact_count" =~ ^[0-9]+$ ]]; then
              printf '%s\n' "authenticated candidate branch inventory count was invalid; operator inventory required for $expected_ref" >&2
              return 1
            fi
            case "$exact_count" in
              0)
                branch_inventory_sha=""
                ;;
              1)
                branch_inventory_sha="$(jq -r '.[0].object.sha // empty' <<<"$exact_matches")"
                if [[ ! "$branch_inventory_sha" =~ ^[0-9a-f]{40}$ ]]; then
                  printf '%s\n' "authenticated candidate branch inventory SHA was invalid; operator inventory required for $expected_ref" >&2
                  return 1
                fi
                ;;
              *)
                printf '%s\n' "multiple exact candidate branch refs found; operator review required for $expected_ref" >&2
                return 1
                ;;
            esac
          }
          inventory_candidate_prs() {
            local inventory
            if ! inventory="$(gh api --paginate -X GET \
              "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100")"; then
              printf '%s\n' 'authenticated candidate PR lookup failed; operator inventory required' >&2
              return 1
            fi
            if ! candidate_pr_related_matches="$(jq -cs \
                --arg expected_body "$body" \
                --arg expected_head "$candidate_sha" \
                --arg expected_branch "$branch" \
                '[.[][] | select(
                  .body == $expected_body and
                  .head.sha == $expected_head and
                  .head.ref == $expected_branch
                )]' <<<"$inventory")"; then
              printf '%s\n' 'authenticated candidate PR inventory was invalid; operator inventory required' >&2
              return 1
            fi
            if ! candidate_pr_related_count="$(jq -r 'length' <<<"$candidate_pr_related_matches")" \
              || [[ ! "$candidate_pr_related_count" =~ ^[0-9]+$ ]]; then
              printf '%s\n' 'authenticated candidate PR inventory was invalid; operator inventory required' >&2
              return 1
            fi
            if ! candidate_pr_matches="$(jq -c \
              --arg expected_repository "$GITHUB_REPOSITORY" \
              --arg expected_repository_id "$GITHUB_REPOSITORY_ID" \
              '[.[] | select(
                .base.ref == "main" and
                ((.head.repo.full_name // "") | ascii_downcase) == ($expected_repository | ascii_downcase) and
                ((.base.repo.full_name // "") | ascii_downcase) == ($expected_repository | ascii_downcase) and
                ((.head.repo.id // "") | tostring) == $expected_repository_id and
                ((.base.repo.id // "") | tostring) == $expected_repository_id
              )]' <<<"$candidate_pr_related_matches")" \
              || ! candidate_pr_count="$(jq -r 'length' <<<"$candidate_pr_matches")" \
              || [[ ! "$candidate_pr_count" =~ ^[0-9]+$ ]]; then
              printf '%s\n' 'authenticated candidate PR repository inventory was invalid; operator inventory required' >&2
              return 1
            fi
            if test "$candidate_pr_related_count" != "$candidate_pr_count"; then
              printf '%s\n' 'candidate PR inventory found foreign repository identity; operator review required' >&2
              return 1
            fi
          }
          cleanup_candidate_pr_after_failure() {
            local pr_number
            if ! inventory_candidate_prs; then
              return 1
            fi
            case "$candidate_pr_count" in
              0)
                printf '%s\n' 'authenticated inventory found no exact candidate PR'
                return 0
                ;;
              1)
                pr_number="$(jq -r '.[0].number // empty' <<<"$candidate_pr_matches")"
                if [[ ! "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
                  printf '%s\n' 'candidate PR inventory number was invalid; operator inventory required' >&2
                  return 1
                fi
                ;;
              *)
                printf '%s\n' 'multiple exact candidate PRs found; operator review required' >&2
                return 1
                ;;
            esac
            if ! gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
              -f state=closed >/dev/null; then
              printf '%s\n' "candidate PR close result was ambiguous for PR ${pr_number}; confirming by inventory" >&2
            fi
            if ! inventory_candidate_prs; then
              return 1
            fi
            if test "$candidate_pr_count" = 0; then
              printf '%s\n' "confirmed candidate PR ${pr_number} is no longer open"
              return 0
            fi
            if test "$candidate_pr_count" = 1; then
              printf '%s\n' "candidate PR ${pr_number} remains open; operator review required" >&2
            else
              printf '%s\n' 'multiple exact candidate PRs remain open; operator review required' >&2
            fi
            return 1
          }
          cleanup_candidate_branch_after_failure() {
            if ! inventory_candidate_branch; then
              return 1
            fi
            if test -z "$branch_inventory_sha"; then
              printf '%s\n' "authenticated inventory confirmed candidate branch $branch is absent"
              return 0
            fi
            if test "$branch_inventory_sha" != "$candidate_sha"; then
              printf '%s\n' "candidate branch $branch is at other SHA $branch_inventory_sha; never delete it; operator review required" >&2
              return 1
            fi
            if ! GIT_CONFIG_COUNT=2 \
              GIT_CONFIG_KEY_0=credential.helper \
              GIT_CONFIG_VALUE_0= \
              GIT_CONFIG_KEY_1=http.https://github.com/.extraheader \
              GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $auth" \
                git push --force-with-lease=refs/heads/$branch:$candidate_sha origin ":refs/heads/$branch"; then
              printf '%s\n' "candidate branch delete result was ambiguous for $branch; confirming by inventory" >&2
            fi
            if ! inventory_candidate_branch; then
              return 1
            fi
            if test -z "$branch_inventory_sha"; then
              printf '%s\n' "confirmed candidate branch $branch is absent"
              return 0
            fi
            if test "$branch_inventory_sha" = "$candidate_sha"; then
              printf '%s\n' "candidate branch $branch remains at the exact candidate; operator inventory required" >&2
            else
              printf '%s\n' "candidate branch $branch moved to other SHA $branch_inventory_sha; never delete it; operator review required" >&2
            fi
            return 1
          }
          cleanup_failed_publish() {
            status=$?
            trap - EXIT
            if test "$status" -ne 0; then
              if test "$pr_post_attempted" = true; then
                if ! cleanup_candidate_pr_after_failure; then
                  status=1
                fi
              fi
              if test "$branch_push_attempted" = true; then
                if ! cleanup_candidate_branch_after_failure; then
                  status=1
                fi
              fi
            fi
            if ! git update-ref -d "$candidate_ref"; then
              status=1
            fi
            exit "$status"
          }
          trap cleanup_failed_publish EXIT
          git fetch --no-tags "$artifact_dir/candidate.bundle" "HEAD:$candidate_ref"
          imported_candidate_sha="$(git rev-parse "$candidate_ref")"
          if test "$imported_candidate_sha" != "$candidate_sha"; then
            printf '%s\n' 'candidate metadata does not match imported bundle HEAD' >&2
            exit 1
          fi
          test "$candidate_sha" != "$base_sha"
          git merge-base --is-ancestor "$base_sha" "$candidate_ref"
          candidate_line="$(git rev-list --parents -n 1 "$candidate_ref")"
          if test "$candidate_line" != "$candidate_sha $base_sha"; then
            printf '%s\n' 'catalog refresh candidate must have the expected base as its single parent' >&2
            exit 1
          fi
          require_live_main_at_base() {
            if ! live_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"; then
              printf '%s\n' 'authenticated live main lookup failed' >&2
              return 1
            fi
            if [[ ! "$live_main_sha" =~ ^[0-9a-f]{40}$ ]]; then
              printf '%s\n' 'authenticated live main lookup returned an invalid object ID' >&2
              return 1
            fi
            if test "$live_main_sha" != "$base_sha"; then
              printf '%s\n' "live main moved from validated base $base_sha to $live_main_sha" >&2
              return 1
            fi
          }
          require_live_main_at_base
          existing_matches="$(gh api --paginate -X GET "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" \
            | jq -cs --arg marker "$body" '[.[][] | select(.body == $marker)]')"
          existing_count="$(jq 'length' <<<"$existing_matches")"
          if test "$existing_count" != 0; then
            if test "$existing_count" != 1; then
              printf '%s\n' 'multiple open PRs have the catalog refresh body; operator review required' >&2
              exit 1
            fi
            existing_pr="$(jq -c '.[0]' <<<"$existing_matches")"
            require_same_repository_identity "matching open catalog refresh PR" "$existing_pr"
            existing_base_sha="$(jq -r '.base.sha // empty' <<<"$existing_pr")"
            existing_head_sha="$(jq -r '.head.sha // empty' <<<"$existing_pr")"
            existing_base_ref="$(jq -r '.base.ref // empty' <<<"$existing_pr")"
            existing_head_ref="$(jq -r '.head.ref // empty' <<<"$existing_pr")"
            existing_url="$(jq -r '.html_url // empty' <<<"$existing_pr")"
            [[ "$existing_base_sha" =~ ^[0-9a-f]{40}$ ]]
            [[ "$existing_head_sha" =~ ^[0-9a-f]{40}$ ]]
            test "$existing_base_sha" = "$base_sha"
            test "$existing_head_sha" = "$candidate_sha"
            test "$existing_base_ref" = main
            test "$existing_head_ref" = "$branch"
            test -n "$existing_url"
            printf '%s\n' "identical open PR no-op receipt: $existing_url"
            exit 0
          fi
          branch_push_attempted=true
          GIT_CONFIG_COUNT=2 \
          GIT_CONFIG_KEY_0=credential.helper \
          GIT_CONFIG_VALUE_0= \
          GIT_CONFIG_KEY_1=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $auth" \
            git push --force-with-lease=refs/heads/$branch: origin "$candidate_ref:refs/heads/$branch"
          require_live_main_at_base
          pr_post_attempted=true
          pr_json="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" \
            -f base=main \
            -f head="$branch" \
            -f title="chore: refresh research catalog" \
            -f body="$body")"
          require_same_repository_identity "new catalog refresh PR response" "$pr_json"
          created_pr_number="$(jq -r '.number // empty' <<<"$pr_json")"
          [[ "$created_pr_number" =~ ^[1-9][0-9]*$ ]]
          pr_base_sha="$(jq -r '.base.sha // empty' <<<"$pr_json")"
          pr_head_sha="$(jq -r '.head.sha // empty' <<<"$pr_json")"
          pr_base_ref="$(jq -r '.base.ref // empty' <<<"$pr_json")"
          pr_head_ref="$(jq -r '.head.ref // empty' <<<"$pr_json")"
          pr_body="$(jq -r '.body // empty' <<<"$pr_json")"
          pr_url="$(jq -r '.html_url // empty' <<<"$pr_json")"
          [[ "$pr_base_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$pr_head_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$pr_base_sha" = "$base_sha"
          test "$pr_head_sha" = "$candidate_sha"
          test "$pr_base_ref" = main
          test "$pr_head_ref" = "$branch"
          test "$pr_body" = "$body"
          test -n "$pr_url"
          printf '%s\n' "$pr_url"
