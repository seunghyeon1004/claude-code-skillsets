schemaVersion: 2
domainId: research-and-intelligence
categories:
  - id: source-discovery
    name:
      ko: 출처 탐색
      en: Source discovery
    description:
      ko: 질문에 필요한 원출처와 후속 조사 경로를 체계적으로 찾는다.
      en: Finds primary sources and follow-up research paths relevant to a question.
    status: draft
  - id: web-research
    name:
      ko: 웹 리서치
      en: Web research
    description:
      ko: 공개 웹 자료를 탐색하고 비교해 최신 근거를 수집한다.
      en: Searches and compares public web material to collect current evidence.
    status: draft
  - id: academic-research
    name:
      ko: 학술 리서치
      en: Academic research
    description:
      ko: 학술 논문과 연구 결과의 방법, 품질, 결론을 조사한다.
      en: Examines the methods, quality, and conclusions of scholarly literature.
    status: draft
  - id: patent-research
    name:
      ko: 특허 리서치
      en: Patent research
    description:
      ko: 특허 문헌과 출원 동향을 조사해 기술 및 권리 지형을 파악한다.
      en: Reviews patent literature and filing trends to map technical and rights landscapes.
    status: draft
  - id: market-research
    name:
      ko: 시장 리서치
      en: Market research
    description:
      ko: 시장 규모, 수요, 세그먼트, 성장 요인을 근거와 함께 분석한다.
      en: Analyzes market size, demand, segments, and growth drivers with evidence.
    status: draft
  - id: competitive-intelligence
    name:
      ko: 경쟁 인텔리전스
      en: Competitive intelligence
    description:
      ko: 경쟁사의 전략, 제품, 강점, 약점을 비교 가능한 형태로 정리한다.
      en: Structures comparable evidence about competitor strategies, products, strengths, and weaknesses.
    status: draft
  - id: customer-research
    name:
      ko: 고객 리서치
      en: Customer research
    description:
      ko: 고객의 행동, 요구, 제약, 구매 맥락을 조사한다.
      en: Investigates customer behavior, needs, constraints, and buying context.
    status: draft
  - id: interview-analysis
    name:
      ko: 인터뷰 분석
      en: Interview analysis
    description:
      ko: 인터뷰 기록에서 반복되는 주제, 근거, 예외를 추출한다.
      en: Extracts recurring themes, supporting evidence, and exceptions from interviews.
    status: draft
  - id: trend-detection
    name:
      ko: 추세 탐지
      en: Trend detection
    description:
      ko: 여러 시점과 출처의 신호를 비교해 의미 있는 변화를 식별한다.
      en: Compares signals across sources and time to identify meaningful change.
    status: draft
  - id: fact-checking
    name:
      ko: 사실 검증
      en: Fact checking
    description:
      ko: 주장과 수치를 독립적인 근거에 대조해 확인하거나 반박한다.
      en: Confirms or challenges claims and figures against independent evidence.
    status: draft
  - id: source-evaluation
    name:
      ko: 출처 평가
      en: Source evaluation
    description:
      ko: 출처의 권위, 최신성, 편향, 추적 가능성을 평가한다.
      en: Evaluates source authority, recency, bias, and traceability.
    status: draft
  - id: evidence-synthesis
    name:
      ko: 근거 종합
      en: Evidence synthesis
    description:
      ko: 일치하거나 충돌하는 근거를 인용과 불확실성을 보존해 종합한다.
      en: Synthesizes supporting and conflicting evidence while preserving citations and uncertainty.
    status: draft
