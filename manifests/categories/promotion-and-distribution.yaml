schemaVersion: 2
domainId: promotion-and-distribution
categories:
  - id: launch-promotion
    name:
      ko: 출시 프로모션
      en: Launch promotion
    description:
      ko: 출시 목표, 대상, 일정, 메시지를 연결한 프로모션 계획을 만든다.
      en: Builds promotion plans connecting launch goals, audiences, timing, and messages.
    status: draft
  - id: social-distribution
    name:
      ko: 소셜 배포
      en: Social distribution
    description:
      ko: 소셜 채널의 이용 맥락과 형식에 맞춰 콘텐츠를 배포한다.
      en: Distributes content according to the formats and usage context of social channels.
    status: draft
  - id: channel-adaptation
    name:
      ko: 채널 적응
      en: Channel adaptation
    description:
      ko: 핵심 메시지를 보존하면서 각 채널의 제약과 관습에 맞게 콘텐츠를 조정한다.
      en: Adapts content to channel constraints and conventions while preserving the core message.
    status: draft
  - id: content-repurposing
    name:
      ko: 콘텐츠 재활용
      en: Content repurposing
    description:
      ko: 하나의 원본을 여러 길이, 형식, 사용 맥락의 자산으로 전환한다.
      en: Converts one source into assets for multiple lengths, formats, and usage contexts.
    status: draft
  - id: pr
    name:
      ko: 홍보
      en: Public relations
    description:
      ko: 조직과 제품의 공적 서사를 근거 있고 일관된 커뮤니케이션으로 관리한다.
      en: Manages the public narrative of an organization or product through supportable, consistent communication.
    status: draft
  - id: media-pitching
    name:
      ko: 미디어 피칭
      en: Media pitching
    description:
      ko: 매체와 기자의 관심사에 맞는 검증 가능한 이야기와 자료를 제안한다.
      en: Proposes verifiable stories and materials aligned with a publication and journalist's interests.
    status: draft
  - id: influencer-work
    name:
      ko: 인플루언서 협업
      en: Influencer work
    description:
      ko: 브랜드 적합성, 공개 의무, 성과 조건을 반영해 인플루언서 협업을 설계한다.
      en: Designs influencer collaborations around brand fit, disclosure duties, and performance terms.
    status: draft
  - id: community
    name:
      ko: 커뮤니티
      en: Community
    description:
      ko: 참여자에게 지속적인 가치를 제공하는 커뮤니티 활동과 대화를 운영한다.
      en: Operates community activities and conversations that provide sustained participant value.
    status: draft
  - id: outreach
    name:
      ko: 아웃리치
      en: Outreach
    description:
      ko: 대상의 맥락과 동의를 존중하는 개인화된 접촉을 계획하고 실행한다.
      en: Plans and carries out personalized contact that respects recipient context and consent.
    status: draft
  - id: campaign-operations
    name:
      ko: 캠페인 운영
      en: Campaign operations
    description:
      ko: 채널, 일정, 자산, 승인, 담당자를 조율해 캠페인을 안정적으로 실행한다.
      en: Coordinates channels, schedules, assets, approvals, and owners for reliable campaign execution.
    status: draft
  - id: performance-feedback
    name:
      ko: 성과 피드백
      en: Performance feedback
    description:
      ko: 배포 결과와 질적 반응을 다음 콘텐츠와 캠페인 개선에 반영한다.
      en: Feeds distribution results and qualitative responses into the next content and campaign improvements.
    status: draft
