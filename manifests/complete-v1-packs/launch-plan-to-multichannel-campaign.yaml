outcome:
  ko: 승인된 출시 계획을 채널별 자산, 미디어·파트너·커뮤니티 아웃리치, 공개 의무, 승인 단계, 성과 피드백이 연결된 다채널 캠페인으로 전환한다.
  en: Turns an approved launch plan into a multichannel campaign connecting adapted assets, media, partner and community outreach, disclosure duties, approvals, and performance feedback.
inputs:
  - Approved launch goals, audience, message hierarchy, proof points, timeline, and channel constraints
  - Media, influencer, community, outreach, disclosure, consent, and approval requirements
outputs:
  - A multichannel campaign plan with adapted assets, owners, schedules, and approval gates
  - An outreach and performance register covering recipients, disclosures, consent, and feedback
completionCriteria:
  - Every channel asset preserves approved claims while meeting channel-specific format and disclosure rules
  - Media, influencer, community, and direct outreach lists have relevance, consent, and ownership evidence
  - Nothing is distributed until named approvers confirm assets, recipients, timing, and measurement setup
routingProfileId: promotion-and-distribution
