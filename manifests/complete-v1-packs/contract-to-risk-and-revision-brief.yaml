  - id: contract-to-risk-and-revision-brief-boundary
    type: boundary
    path: tests/evaluations/packs/contract-to-risk-and-revision-brief/boundary.yaml
  - id: contract-to-risk-and-revision-brief-refusal
    type: refusal
    path: tests/evaluations/packs/contract-to-risk-and-revision-brief/refusal.yaml
replacesPackIds: []
