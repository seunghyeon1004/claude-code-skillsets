    type: normal
    path: tests/evaluations/packs/transactions-to-management-report/normal.yaml
  - id: transactions-to-management-report-boundary
    type: boundary
    path: tests/evaluations/packs/transactions-to-management-report/boundary.yaml
  - id: transactions-to-management-report-refusal
