outcome:
  ko: 원본 영상을 이야기와 사실을 보존하는 편집, 접근 가능한 자막, 명료한 오디오, 권리 확인된 음악과 최종 품질 검수를 거친 승인 가능한 게시 영상으로 전환한다.
  en: Turns raw footage into an approval-ready published video through meaning-preserving editing, accessible captions, intelligible audio, rights-cleared music, and final quality control.
inputs:
  - Raw footage, edit brief, verified factual references, brand assets, consent records, and target platform specifications
  - Caption and transcript requirements, audio references, music and effects licenses, thumbnail needs, and publishing approver
outputs:
  - A refined master video with motion graphics, thumbnail, accessible captions, mixed audio, and documented rights provenance
  - Platform-ready export files, transcript, caption files, format validation, quality-control report, and explicit publishing approval record
completionCriteria:
  - Accurate synchronized captions identify speakers and meaningful sounds, while readable safe-area text remains legible across target viewports
  - Audio intelligibility, transcript accuracy, music rights, factual continuity, export format, and platform playback pass documented quality control
  - Publishing remains unapproved until the accountable reviewer accepts the master, thumbnail, captions, transcript, rights evidence, and final format
routingProfileId: video-and-audio
