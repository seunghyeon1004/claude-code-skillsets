schemaVersion: 2
id: use-case-to-agent-design
domainId: ai-agents-and-automation
categoryIds:
  - use-case-fit
  - model-selection
  - prompting
  - context
  - mcp
  - tool-calls
  - single-agents
  - multi-agent-systems
  - cost
