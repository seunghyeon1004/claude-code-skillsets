domainId: writing-and-publishing
categoryIds:
  - ideation
  - outlining
  - long-form-writing
  - blogs
  - newsletters
  - editing
  - proofreading
  - citation-verification
  - copywriting
outcome:
  ko: 초기 아이디어를 독자와 채널에 맞는 개요, 근거 있는 장문 원고, 검증된 인용, 편집된 제목과 행동 요청을 갖춘 출판 준비 글로 전환한다.
  en: Turns an initial idea into a publication-ready article with an audience-specific outline, evidence-backed long-form draft, verified citations, and edited headline and call to action.
inputs:
  - Article idea, target audience, publication channel, purpose, and desired reader action
  - Approved sources, voice guidance, length constraints, and factual review requirements
outputs:
  - An edited long-form article with headline, structure, citations, and channel-ready formatting
  - An editorial verification record covering claims, sources, mechanics, and unresolved questions
completionCriteria:
  - The article follows an approved outline and sustains a clear argument for the intended audience
  - Material factual claims and quotations are verified against traceable approved sources
  - Editing, proofreading, headline, and call-to-action review are complete without unsupported claims
routingProfileId: writing-and-publishing
