schemaVersion: 2
domainId: legal-risk-and-compliance
capabilities:
  - id: assist-with-legal-research
    ownerDomainId: legal-risk-and-compliance
    categoryIds:
      - legal-research-assistance
    outcome:
      ko: 관할, 쟁점, 권위 있는 출처, 적용 근거, 상충 자료와 불확실성이 구분된 법률 조사 브리프를 만든다. 자격 있는 담당자의 검토를 지원하며 최종 판단이나 승인을 대신하지 않는다.
      en: Produces a legal research brief distinguishing jurisdiction, issues, authoritative sources, application rationale, conflicting material, and uncertainty. It supports qualified human review and does not replace final judgment or approval.
    status: draft
  - id: assist-with-contract-drafting-and-review
    ownerDomainId: legal-risk-and-compliance
    categoryIds:
      - contract-drafting-assistance
      - contract-review-assistance
    outcome:
      ko: 합의한 조건, 의무, 권리, 예외, 불일치, 협상 쟁점과 미확정 사항이 추적 가능한 계약 초안 및 검토 브리프를 만든다. 자격 있는 담당자의 검토를 지원하며 최종 판단이나 승인을 대신하지 않는다.
      en: Produces a traceable contract draft and review brief covering agreed terms, obligations, rights, exceptions, inconsistencies, negotiation issues, and unresolved points. It supports qualified human review and does not replace final judgment or approval.
    status: draft
  - id: maintain-legal-and-compliance-policies
    ownerDomainId: legal-risk-and-compliance
    categoryIds:
      - policies
    outcome:
      ko: 적용 범위, 책임, 통제, 예외, 승인, 근거 출처와 갱신 주기가 명확한 법무 및 컴플라이언스 정책 초안을 만든다. 자격 있는 담당자의 검토를 지원하며 최종 판단이나 승인을 대신하지 않는다.
      en: Produces a draft legal and compliance policy with explicit scope, responsibilities, controls, exceptions, approval, source authority, and review cycle. It supports qualified human review and does not replace final judgment or approval.
    status: draft
  - id: assess-privacy-and-intellectual-property-risk
    ownerDomainId: legal-risk-and-compliance
    categoryIds:
      - privacy
      - intellectual-property
    outcome:
      ko: 개인정보 흐름과 권리 요청, 창작물과 발명의 소유권, 라이선스, 통제와 미확인 위험을 연결한 검토 자료를 만든다. 자격 있는 담당자의 검토를 지원하며 최종 판단이나 승인을 대신하지 않는다.
      en: Produces review material connecting personal-data flows and rights requests to ownership, licensing, controls, and unresolved risks for works and inventions. It supports qualified human review and does not replace final judgment or approval.
    status: draft
  - id: map-regulations-to-compliance-checklists
    ownerDomainId: legal-risk-and-compliance
    categoryIds:
      - regulatory-mapping
      - compliance-checklists
    outcome:
      ko: 규제 요구사항을 적용 업무, 시스템, 담당자, 수행 단계, 증거 위치와 검토 주기에 연결한 컴플라이언스 체크리스트를 만든다. 자격 있는 담당자의 검토를 지원하며 최종 판단이나 승인을 대신하지 않는다.
      en: Produces a compliance checklist mapping regulatory requirements to applicable activities, systems, owners, actions, evidence locations, and review cycles. It supports qualified human review and does not replace final judgment or approval.
    status: draft
  - id: maintain-risk-registers-and-audit-evidence
    ownerDomainId: legal-risk-and-compliance
    categoryIds:
      - risk-registers
      - audit-evidence
    outcome:
      ko: 위험의 원인, 영향, 가능성, 통제, 잔여 위험을 통제 수행의 원본 증거와 추적 정보에 연결한 등록부를 만든다. 자격 있는 담당자의 검토를 지원하며 최종 판단이나 승인을 대신하지 않는다.
      en: Produces a register connecting risk causes, impacts, likelihood, controls, and residual risk to source evidence and traceability for control performance. It supports qualified human review and does not replace final judgment or approval.
    status: draft
  - id: coordinate-compliance-incident-response
    ownerDomainId: legal-risk-and-compliance
    categoryIds:
      - compliance-incident-response
    outcome:
      ko: 의심 사고의 사실, 영향, 역할, 증거 보존, 보고 선택지, 시정과 후속 검토가 추적 가능한 대응 기록을 만든다. 자격 있는 담당자의 검토를 지원하며 최종 판단이나 승인을 대신하지 않는다.
      en: Produces a traceable response record covering suspected-incident facts, impact, roles, evidence preservation, reporting options, remediation, and follow-up review. It supports qualified human review and does not replace final judgment or approval.
    status: draft
  - id: govern-records-retention-and-deletion
    ownerDomainId: legal-risk-and-compliance
    categoryIds:
      - records-retention
      - deletion
    outcome:
      ko: 기록 유형별 보존 근거, 기간, 보류, 접근, 삭제 승인, 범위, 검증과 증거를 연결한 수명주기 계획을 만든다. 자격 있는 담당자의 검토를 지원하며 최종 판단이나 승인을 대신하지 않는다.
      en: Produces a record-lifecycle plan connecting retention basis, periods, holds, access, deletion approval, scope, verification, and evidence by record type. It supports qualified human review and does not replace final judgment or approval.
    status: draft
