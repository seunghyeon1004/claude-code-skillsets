schemaVersion: 2
domainId: promotion-and-distribution
capabilities:
  - id: plan-launch-promotion
    ownerDomainId: promotion-and-distribution
    categoryIds:
      - launch-promotion
    outcome:
      ko: 출시 목표, 대상, 메시지, 일정, 채널을 연결한 실행 가능한 프로모션 계획을 만든다.
      en: Produces an executable promotion plan connecting launch goals, audiences, messages, timing, and channels.
