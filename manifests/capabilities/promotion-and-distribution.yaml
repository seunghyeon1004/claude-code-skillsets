  - id: adapt-repurpose-and-distribute-content
    ownerDomainId: promotion-and-distribution
    categoryIds:
      - social-distribution
      - channel-adaptation
      - content-repurposing
    outcome:
      ko: 원본의 핵심을 보존하면서 채널별 형식과 이용 맥락에 맞춘 배포 자산을 만든다.
      en: Produces distribution assets adapted to channel formats and usage contexts while preserving the source's core meaning.
    status: draft
  - id: secure-earned-media-coverage
    ownerDomainId: promotion-and-distribution
    categoryIds:
      - pr
      - media-pitching
    outcome:
      ko: 검증 가능한 공적 서사, 대상 매체, 맞춤 피치, 후속 자료가 포함된 미디어 패키지를 만든다.
