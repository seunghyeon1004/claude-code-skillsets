    status: draft
  - id: conduct-targeted-outreach
    ownerDomainId: promotion-and-distribution
    categoryIds:
      - outreach
    outcome:
      ko: 대상의 맥락, 개인화 근거, 동의, 후속 기준이 명확한 아웃리치 계획을 만든다.
      en: Produces an outreach plan with explicit recipient context, personalization evidence, consent, and follow-up criteria.
    status: draft
  - id: operate-and-optimize-campaigns
    ownerDomainId: promotion-and-distribution
    categoryIds:
      - campaign-operations
      - performance-feedback
    outcome:
      ko: 일정, 자산, 승인, 담당자, 성과 피드백이 연결된 캠페인 운영 기록을 만든다.
      en: Produces a campaign operating record connecting schedules, assets, approvals, owners, and performance feedback.
    status: draft
